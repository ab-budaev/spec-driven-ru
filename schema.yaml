name: spec-driven-ru
version: 1
description: Кастомная схема OpenSpec на базе spec-driven (proposal → specs → design → tasks) с Gherkin-сценариями, приоритетами P0/P1/P2 и двуязычными требованиями
artifacts:
  - id: proposal
    generates: proposal.md
    description: Документ с описанием изменений в проекте / системе
    template: proposal.md
    instruction: >
      Создай документ, который описывает причины изменений.

      Правила:
      - Опиши существующую проблему и мотивацию для ее решения. Важно ответить объяснить почему предлагаемые изменения нужно сделать
      - Опиши какую функциональность и (или) сценарии нужно добавить, изменить или удалить в системе.
      - Опиши влияние изменений на пользователей особенно в сценариях работы с данными
  - id: specs
    generates: "specs/**/*.md"
    description: Detailed specifications for the change
    template: spec.md
    instruction: >
      Создай файлы спецификаций, которые описывают что система ДОЛЖНА делать.

      Создай один файл для одной функциональной возможности (capability). Примеры capabilities - authentication, admin-api, user-api

      - Новые capabilities: используй имя в kebab-case из proposal документа (specs/<capability>/spec.md).
      - Измененные capabilities: используй имя из уже существующих директорий openspec/specs/<capability>/ когда создаешь новую delta-спецификацию

      Правила проекта (обязательны):

      - Все сценарии пиши в формате Given/When/Then (Gherkin): шаги GIVEN/WHEN/THEN.
      - Назначай каждому сценарию приоритет P0/P1/P2 - префикс [P0]/[P1]/[P2]
        в заголовке сценария (например, `#### Scenario: [P0] Успешный вход`).
      - Сценарий оформляй заголовком ровно из четырёх `#` (`#### Scenario:`) -
        с тремя `#` или маркером списка OpenSpec его не распознает.
      - Для измененных capabilities используй секции ## MODIFIED Requirements,
        ## REMOVED Requirements (с полями **Reason** и **Migration**) и
        ## RENAMED Requirements (формат FROM:/TO:) - под ## ADDED Requirements
        только новые требования.
      - Требования формулируй на двух языках: "Система ДОЛЖНА (MUST) ...",
        "Система МОЖЕТ (MAY) ..." - валидатор OpenSpec ищет в тексте требования
        английские SHALL/MUST и без них выдаёт предупреждения.
      - Каждое требование ДОЛЖНО (MUST) содержать хотя бы один сценарий
      - Каждый сценарий должен быть сформулирован как будущий test-case
    requires:
      - proposal
  - id: design
    generates: design.md
    description: Technical design decisions and implementation approach
    template: design.md
    instruction: >
      Создай документ с описанием того, КАК будут работать предлагаемые изменения.

      Когда нужен design.md (в иных случаях не создавай его):
      - Изменения в API, TUI или CLI интерфейсах и (или) в модели данных
      - Изменения в архитектуре проекта или компонента (или нескольких компонентов)
      - Изменения касаются производительности или безопасности проекта
      - Есть неопределенность, которую нужно решить перед началом разработки

      Фокусируйся на архитектуре, API интерфейсах и прочих значимых для пользователя и инженера частях. Не закапывайся в детализацию до имен функций, классов и методов.
      Ссылайся на proposal в тех местах, где нужна отсылка к проблематике или требованиям.

      Используй Mermaid диаграммы для визуализации связей между компонентами и (или) визуализации пользовательских процессов работы с системой. А также, для визуализации алгоритмов.

      Критерии хорошего дизайн-документа:
      - Отвечает на вопрос "как будет реализовано решение"
      - Показывает риски и ограничения с приоритетами и аргументацией их принятия
      - Показывает альтернативные варианты решений с плюсами и минусами каждого, а также с аргументацией выбранного решения
    requires:
      - proposal
  - id: tasks
    generates: tasks.md
    description: Implementation checklist with trackable tasks
    template: tasks.md
    instruction: >
      Декомпозируй предлагаемые изменения и раздели на этапы с конкретным списком задач

      **ВАЖНО: Следуй правилам:**

      - Группируй задачи по смысловым группам. Такими группами могут быть компоненты системы и (или) capabilities. Используй H2 заголовки для группировки задач.
      - Сопоставляй задачу с сервисом или компонентом, который она затрагивает (например, Frontend, Backend, Infra, Docs), — указывай это в тексте задачи.
      - Используй чекбоксы. Пример: `- [ ] Task to be done`. Задачи без префикса `- [ ]` не будут считаться задачами (OpenSpec фрейморк не поймет)
      - Создавай атомарные задачи, каждый этап или подзадачу должно быть возможно закрыть в рамках одной сессии работы с агентом
      - Сортируй задачи по правилу: сначала изменения в UI, позже - изменения на более низких уровнях проекта

      Для каждой задачи пиши критерии приемки. Так ты или человек поймете действительно ли она завершена.

      Если задача затрагивает изменения в кодовой базе, запускай соответствующие проекту команды
      - `make lint` - для запуска линтеров
      - `make test` - для запуска тестов

      В случае необходимости запускай более конкретные инструменты для тестирования, но никогда не пропускай этот этап.
    requires:
      - specs
      - design
apply:
  requires:
    - tasks
  tracks: tasks.md
